<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Portal de Reservas | UNIFAMETRO</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="login-container">

        <section class="login-card">

            <div class="logo-area">
                <h1>PORTAL DE RESERVAS</h1>
                <p>UNIFAMETRO</p>
            </div>

            <div class="login-title">
                <h2>Acesso acadêmico</h2>
                <p>Entre com seu e-mail institucional.</p>
            </div>

            <form id="loginForm">

                <label for="email">
                    E-mail institucional
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="seuemail@aluno.unifametro.edu.br"
                    required
                >

                <label for="password">
                    Senha
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Digite sua senha"
                    required
                >

                <button type="submit">
                    ENTRAR
                </button>

                <p id="message"></p>

            </form>

        </section>

    </main>

    <script src="app.js"></script>

</body>
</html>
